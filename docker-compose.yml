# RateGuard local stack (starter): Redis for running a track on your machine.
#   docker compose up -d redis      then   cd tracks/<track> && make run
# In Phase 6 you add the app itself as a service (one profile per track).
name: rateguard

services:
  redis:
    image: redis:7.4-alpine
    # Append-only file: tenants and keys survive a restart. Limiter state would expire anyway.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional local LLM (Phase 3 M5):  docker compose --profile ollama up -d
  # then: docker compose exec ollama ollama pull llama3.2:1b  and run your track with
  #       AI_PROVIDER=llm LLM_BASE_URL=http://localhost:11434/v1
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  redisdata:
  ollama:
