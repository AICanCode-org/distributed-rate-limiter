spring.application.name=rateguard
server.port=${PORT:8080}
server.shutdown=graceful
spring.main.banner-mode=off
# Never leak stack traces to clients; errors are rendered by ProblemHandler.
server.error.include-stacktrace=never
# v1.1 (Phase 7): one JSON object per log line (MDC requestId + key/value pairs included).
logging.structured.format.console=logstash
