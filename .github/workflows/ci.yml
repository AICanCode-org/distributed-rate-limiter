# Full CI (Phase 5). Runs only the tracks whose files changed (plus everything when shared files
# change), each through the reusable workflow. "ci-ok" is the single check to mark as *required*
# in branch protection.  Every concept is explained in docs/github-actions-explained.md.
name: CI

on:
  push:
    branches: [main, solution]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      docs: ${{ steps.filter.outputs.docs }}
      java: ${{ steps.filter.outputs.java }}
      python: ${{ steps.filter.outputs.python }}
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'cms/**'
            shared:
              - 'spec/**'
              - 'scripts/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            java:
              - 'tracks/java/**'
            python:
              - 'tracks/python/**'
            typescript:
              - 'tracks/typescript/**'

  contract:
    name: Contract · OpenAPI + scripts + CMS export
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate spec/openapi.yaml
        run: pipx run openapi-spec-validator spec/openapi.yaml
      - name: Check shell scripts
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck --severity=error scripts/*.sh
      - name: CMS export is up to date with docs/ (python3 scripts/build-cms.py)
        run: python3 scripts/build-cms.py --check

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-track-ci.yml
    with:
      track: java

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-track-ci.yml
    with:
      track: python

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-track-ci.yml
    with:
      track: typescript

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, contract, java, python, typescript]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled (skipped is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
